<text x="478.5" y="343" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="9" fill="#61625e" text-anchor="middle" font-weight="550" opacity="0.75">112</text>
<line x1="561" y1="92" x2="561" y2="312" stroke="#2a2c31" stroke-width="1" stroke-linecap="butt" opacity="0.55"/>
<text x="561" y="330" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="10.5" fill="#61625e" text-anchor="middle" font-weight="550">60</text>
<text x="561" y="343" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="9" fill="#61625e" text-anchor="middle" font-weight="550" opacity="0.75">134</text>
<line x1="643.5" y1="92" x2="643.5" y2="312" stroke="#2a2c31" stroke-width="1" stroke-linecap="butt" opacity="0.55"/>
