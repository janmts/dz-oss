<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-label="FH6 drift-zone speed factor curve">
<title>FH6 drift-zone speed factor curve</title>
<desc>Speed factor vs speed: zero below 1.5 m/s, then a straight line rising to 1.0 at the 60 m/s (about 134 mph) cap, flat beyond.</desc>
<rect x="0.5" y="0.5" width="759" height="391" fill="#16171b" stroke="#222428" stroke-width="1" rx="8"/>
<rect x="20" y="26" width="3" height="20" rx="1.5" fill="#d2a24c"/>
<text x="32" y="36" font-family="'Inter Variable','Segoe UI',system-ui,sans-serif" font-size="17" fill="#f2f2f0" text-anchor="start" font-weight="650">The speed curve</text>
<text x="32" y="56" font-family="'Inter Variable','Segoe UI',system-ui,sans-serif" font-size="12" fill="#8a8b85" text-anchor="start" font-weight="500">A straight line · speed_factor(speed) = min(speed, 60) / 60</text>
<rect x="66" y="92" width="660" height="220" fill="#0f1012" stroke="#222428" stroke-width="1" rx="3"/>
<line x1="66" y1="312" x2="726" y2="312" stroke="#2a2c31" stroke-width="1" stroke-linecap="butt" opacity="0.7"/>
<text x="56" y="315.5" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="10.5" fill="#61625e" text-anchor="end" font-weight="550">0.00</text>
<line x1="66" y1="262" x2="726" y2="262" stroke="#2a2c31" stroke-width="1" stroke-linecap="butt" opacity="0.7"/>
<text x="56" y="265.5" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="10.5" fill="#61625e" text-anchor="end" font-weight="550">0.25</text>
<line x1="66" y1="212" x2="726" y2="212" stroke="#2a2c31" stroke-width="1" stroke-linecap="butt" opacity="0.7"/>
<text x="56" y="215.5" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="10.5" fill="#61625e" text-anchor="end" font-weight="550">0.50</text>
<line x1="66" y1="162" x2="726" y2="162" stroke="#2a2c31" stroke-width="1" stroke-linecap="butt" opacity="0.7"/>
<text x="56" y="165.5" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="10.5" fill="#61625e" text-anchor="end" font-weight="550">0.75</text>
<line x1="66" y1="112" x2="726" y2="112" stroke="#2a2c31" stroke-width="1" stroke-linecap="butt" opacity="0.7"/>
<text x="56" y="115.5" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="10.5" fill="#61625e" text-anchor="end" font-weight="550">1.00</text>
<text x="66" y="330" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="10.5" fill="#61625e" text-anchor="middle" font-weight="550">0</text>
<text x="66" y="343" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="9" fill="#61625e" text-anchor="middle" font-weight="550" opacity="0.75">0</text>
