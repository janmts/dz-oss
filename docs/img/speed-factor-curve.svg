<text x="643.5" y="343" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="9" fill="#61625e" text-anchor="middle" font-weight="550" opacity="0.75">157</text>
<line x1="726" y1="92" x2="726" y2="312" stroke="#2a2c31" stroke-width="1" stroke-linecap="butt" opacity="0.55"/>
<text x="726" y="330" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="10.5" fill="#61625e" text-anchor="middle" font-weight="550">80</text>
<text x="726" y="343" font-family="'JetBrains Mono','JetBrains Mono Variable','Cascadia Mono',Consolas,monospace" font-size="9" fill="#61625e" text-anchor="middle" font-weight="550" opacity="0.75">179</text>
<line x1="561" y1="92" x2="561" y2="312" stroke="#d2a24c" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 4" opacity="0.7"/>
<path d="M 78.38,312 L 78.38,307 L 561,112 L 726,112 L 726,312 L 78.38,312 Z" fill="#84b577" opacity="0.1"/>
<polyline points="66,312 78.38,312 78.38,307 561,112 726,112" fill="none" stroke="#84b577" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="561" cy="112" r="3.6" fill="#d2a24c" stroke="#0f1012" stroke-width="1.5"/>
<circle cx="78.38" cy="312" r="3.2" fill="#d56c62" stroke="#0f1012" stroke-width="1.5"/>
<text x="88.38" y="290" font-family="'Inter Variable','Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#d56c62" text-anchor="start" font-weight="600">1.5 m/s floor</text>
<text x="88.38" y="303" font-family="'Inter Variable','Segoe UI',system-ui,sans-serif" font-size="9.5" fill="#61625e" text-anchor="start" font-weight="550">(nothing scores below)</text>
<text x="553" y="100" font-family="'Inter Variable','Segoe UI',system-ui,sans-serif" font-size="11" fill="#ecc274" text-anchor="end" font-weight="600">saturates at 60 m/s</text>
<text x="553" y="114" font-family="'Inter Variable','Segoe UI',system-ui,sans-serif" font-size="9.5" fill="#8a8b85" text-anchor="end" font-weight="550">(~134 mph) — more speed, no more credit</text>
<text x="297" y="208.67" font-family="'Inter Variable','Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#aaaaa5" text-anchor="middle" font-weight="550">linear: twice the speed, twice the rate</text>
<text x="396" y="361" font-family="'Inter Variable','Segoe UI',system-ui,sans-serif" font-size="10" fill="#8a8b85" text-anchor="middle" font-weight="600" letter-spacing="1.2">SPEED  —  M/S (TOP)  ·  MPH (BELOW)</text>
<text x="22" y="202" font-family="'Inter Variable','Segoe UI',system-ui,sans-serif" font-size="10" fill="#8a8b85" text-anchor="middle" font-weight="600" letter-spacing="1.4" transform="rotate(-90 22 202)">SPEED FACTOR</text>
</svg>
