name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true

jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          # The Windows MSI (WiX) bundler only accepts MAJOR.MINOR.PATCH with an
          # optional NUMERIC pre-release identifier <= 65535. Reject anything else
          # here so a bad input fails before pushing a tag or starting any build.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Use MAJOR.MINOR.PATCH, optionally with a numeric pre-release <= 65535 (e.g. 1.1.2 or 1.1.2-1). Non-numeric identifiers like '-pre1' or '-rc1' break the Windows MSI build."
            exit 1
          fi

      - name: Bump version and tag
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "${{ inputs.version }}" ]; then
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.version = '${{ inputs.version }}';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
              p.version = '${{ inputs.version }}';
              fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(p, null, 2) + '\n');
            "
            node -e "
              const fs = require('fs');
              let s = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
              s = s.replace(/^version = \".*\"$/m, 'version = \"${{ inputs.version }}\"');
              fs.writeFileSync('src-tauri/Cargo.toml', s);
            "
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
            git commit -m "chore: release v${{ inputs.version }}"
            git push origin HEAD
          else
            echo "Version already ${{ inputs.version }}, skipping bump commit"
          fi
          git tag "v${{ inputs.version }}" 2>/dev/null || echo "Tag already exists locally"
          git push origin "v${{ inputs.version }}" 2>/dev/null || echo "Tag already exists on remote"

  # The game is Windows/Xbox-only, so the desktop app ships for Windows. Linux/macOS
  # users and anyone running the headless web server build from source (see the README
  # and docs/headless-server.md) — no prebuilt binaries for those paths.
  build:
    needs: prepare
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: ./.github/actions/setup-build-env

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ''
          tagName: v${{ inputs.version }}
          releaseName: DZ-OSS v${{ inputs.version }}
          releaseBody: |
            ### Windows desktop app

            Download and run the installer:

            - [**.exe installer**](https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/DZ-OSS_${{ inputs.version }}_x64-setup.exe) — recommended
            - [.msi](https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/DZ-OSS_${{ inputs.version }}_x64_en-US.msi)

            **Forza setup** — Settings → HUD and Gameplay → Data Out: **On** · Format: **Car Dash** · IP: `127.0.0.1` · Port: **20440**

            ---

            **Linux / macOS, or the headless web server?** Build from source — it's a quick `npm install && npm run tauri build` (add `--features server` for the `dz-oss-serve` headless binary). See [Running from Source](https://github.com/${{ github.repository }}#running-from-source) and the [headless server guide](https://github.com/${{ github.repository }}/blob/main/docs/headless-server.md).
          releaseDraft: true
          prerelease: false
